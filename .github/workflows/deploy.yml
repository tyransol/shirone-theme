# 双仓部署：内容仓推送（repository_dispatch）或代码仓 push -> 构建站点 -> 发布到 Cloudflare Pages。
#
# 架构遵循 docs/content-separation/dual-repo-ci.md（变体 A 的 Cloudflare 版）：
#   - 内容仓 trigger-build.yml 通过 DISPATCH_TOKEN 发送 repository_dispatch；
#   - 本工作流按触发信号携带的 SHA 精确检出内容，物化后构建，再用 wrangler 直传 Pages。
#
# 需要在本仓库 Settings > Secrets and variables > Actions 配置：
#   - CONTENT_REPO_TOKEN：内容仓为私有时必填，对 tyransol/shirone 授予 Contents: Read 的 PAT；
#   - CLOUDFLARE_API_TOKEN：Cloudflare API 令牌，权限为 Account > Cloudflare Pages > Edit；
#   - CLOUDFLARE_ACCOUNT_ID：Cloudflare 账户 ID（仪表盘右侧可见）。
# 可选：
#   - BILI_SESSDATA：构建期同步 B 站番剧数据（未配置时 anime:sync 自动跳过）。

name: Deploy

on:
  # 代码变更（docs/rules/README 等纯文档改动不触发）。
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "rules/**"
      - "README*.md"
      - "*.md"
  # 内容仓 trigger-build.yml 发来的事件。
  repository_dispatch:
    types: [content-updated]
  # 手动触发；回滚时把 content_ref 填成旧的内容 SHA。
  workflow_dispatch:
    inputs:
      content_ref:
        description: "内容仓 ref 或 commit SHA（留空使用 main）"
        required: false
        default: ""
  # 兜底：repository_dispatch 事件偶尔会丢，每天重建一次保证最终一致。
  schedule:
    - cron: "17 4 * * *"

# 并发控制：同一时间只允许一个部署流水线运行。
# 新触发的构建会自动取消正在运行中的旧构建，确保始终以最新代码 + 最新内容为准。
concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

env:
  # TODO: 与 Cloudflare Pages 项目名保持一致。
  CF_PAGES_PROJECT: shirone
  CONTENT_REPOSITORY: tyransol/shirone
  CONTENT_WORKING_COPY: .content-src

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      # 让 content:sync 走「本地目录」模式，内容由下面的 checkout 步骤取得。
      CONTENT_DIR: .content-src

    steps:
      - name: Resolve content ref
        id: target
        # 经 env 传递而不是直接内插到脚本里：client_payload 属于外部输入，
        # 直接内插会形成 shell 注入面。
        env:
          PAYLOAD_SHA: ${{ github.event.client_payload.sha }}
          INPUT_REF: ${{ github.event.inputs.content_ref }}
        run: |
          set -euo pipefail
          ref="${PAYLOAD_SHA:-}"
          [ -n "$ref" ] || ref="${INPUT_REF:-}"
          [ -n "$ref" ] || ref="main"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout theme
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Checkout content
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ env.CONTENT_REPOSITORY }}
          ref: ${{ steps.target.outputs.ref }}
          path: ${{ env.CONTENT_WORKING_COPY }}
          # 内容仓公开时可以删掉 token 一行。
          token: ${{ secrets.CONTENT_REPO_TOKEN }}
          persist-credentials: false

      - name: Record content commit
        id: content
        run: |
          set -euo pipefail
          echo "sha=$(git -C '${{ env.CONTENT_WORKING_COPY }}' rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 9.14.4
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Restore build caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          # 缩略图按源图内容哈希复用，跨 commit 的缓存命中安全且有效；
          # 内容层存储（.astro / node_modules/.astro）不跨 commit 缓存，避免集合清空后旧条目残留。
          path: |
            public/assets/moments/thumbnails
          key: ${{ runner.os }}-shirone-thumbnails-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-shirone-thumbnails-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      # 独立成步，而不是依赖 `pnpm build` 内部再跑一次：
      # 内容问题（含 config/*.yaml 的类型校验）与构建问题因此在日志里天然分开。
      - name: Materialize content and config
        run: pnpm content:sync

      # 番剧数据与封面：缓存 + 按需刷新。
      # 未配置 provider 时，anime:sync 会自动跳过并 exit 0，对未启用番剧的站点零影响。
      - name: Restore anime cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            src/data/anime-snapshots
            public/assets/anime/covers
          key: ${{ runner.os }}-shirone-anime-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-shirone-anime-

      - name: Sync anime data (best effort)
        run: pnpm anime:sync --if-stale
        env:
          BILI_SESSDATA: ${{ secrets.BILI_SESSDATA }}

      - name: Build site
        run: pnpm build
        env:
          # 按需补齐可选功能的凭据。
          BILI_SESSDATA: ${{ secrets.BILI_SESSDATA }}

      # 部署：wrangler 直传 Cloudflare Pages（direct upload 项目）。
      # branch=main 表示生产部署；先在 Cloudflare 仪表盘创建同名 Pages 项目。
      - name: Deploy to Cloudflare Pages
        run: |
          pnpm dlx wrangler@latest pages deploy dist \
            --project-name "$CF_PAGES_PROJECT" \
            --branch main \
            --commit-dirty true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Summarize
        if: always()
        run: |
          set -euo pipefail
          {
            echo "### Shirone deploy"
            echo ""
            echo "- 内容仓：\`${CONTENT_REPOSITORY}\`"
            echo "- 内容 ref：\`${{ steps.target.outputs.ref }}\`"
            echo "- 内容 commit：\`${{ steps.content.outputs.sha }}\`"
            if [ -f content.lock.json ]; then
              echo ""
              echo "<details><summary>content.lock.json</summary>"
              echo ""
              echo '```json'
              cat content.lock.json
              echo '```'
              echo ""
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
